          description: 'AlarmEventRecords provided from cache'
          content:
            application/json:
              schema:
                type: object
                required:
                  - alarms-1-0:alarm-event-records
                properties:
                  alarms-1-0:alarm-event-records:
                    $ref: '#/components/schemas/alarm-event-records'
                example:
                  alarms-1-0:alarm-event-records:
                    alarm-event-record-list:
                      - alarm-event-sequence-number: 0
                        alarm-type-id: 'string'
                        alarm-type-qualifier: 'string'
                        resource: 'string'
                        alarm-severity: 'alarms-1-0:SEVERITY_AND_CLEARED_TYPE_INDETERMINATE'
                        timestamp: '2010-11-20T14:00:00+01:00'
                    number-of-alarm-event-records: 0
