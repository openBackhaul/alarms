  /core-model-1-4:network-control-domain=cache/control-construct={mountName}/alarms-1-0:alarm-pac/alarm-configuration:
    parameters:
      - $ref: '#/components/parameters/user'
      - $ref: '#/components/parameters/originator'
      - $ref: '#/components/parameters/x-correlator'
      - $ref: '#/components/parameters/trace-indicator'
      - $ref: '#/components/parameters/customer-journey'
      - $ref: '#/components/parameters/mountName'
      - $ref: '#/components/parameters/fields'
    get:
      operationId: getAlarmConfiguration
      summary: 'Provides AlarmConfiguration from cache'
      tags:
        - IndividualServices
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: 'AlarmConfiguration provided from cache'
          content:
            application/json:
              schema:
                type: object
                required:
                  - alarms-1-0:alarm-configuration
                properties:
                  alarms-1-0:alarm-configuration:
                    $ref: '#/components/schemas/alarm-configuration'
                example:
                  alarms-1-0:alarm-configuration:
                    severity-configuration-list:
                      - severity-configuration-identifier: 'string'
                        alarm-type-id: 'string'
                        alarm-type-qualifier: 'string'
                        resource-list:
                          - 'string'
                        resource-group-description: 'string'
                        severity-level-list:
                          - 'alarms-1-0:SEVERITY_TYPE_INDETERMINATE'
                    behavior-management-list:
                      - alarm-type-id: 'string'
                        alarm-type-qualifier: 'string'
                        resource: 'string'
                        behavior: 'alarms-1-0:BEHAVIOR_TYPE_FULLY_FUNCTIONAL'  
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
            exec-time:
              $ref: '#/components/headers/exec-time'
            backend-time:
              $ref: '#/components/headers/backend-time'
            life-cycle-state:
              $ref: '#/components/headers/life-cycle-state'
        '4XX':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '500':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        default:
          $ref: '#/components/responses/responseForErroredServiceRequests'
  /core-model-1-4:network-control-domain=cache/control-construct={mountName}/alarms-1-0:alarm-pac/current-alarms:
    parameters:
      - $ref: '#/components/parameters/user'
      - $ref: '#/components/parameters/originator'
      - $ref: '#/components/parameters/x-correlator'
      - $ref: '#/components/parameters/trace-indicator'
      - $ref: '#/components/parameters/customer-journey'
      - $ref: '#/components/parameters/mountName'
      - $ref: '#/components/parameters/fields'
    get:
      operationId: getCurrentAlarms
      summary: 'Provides CurrentAlarms from cache'
      tags:
        - IndividualServices
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: 'CurrentAlarms provided from cache'
          content:
            application/json:
              schema:
                type: object
                required:
                  - alarms-1-0:current-alarms
                properties:
                  alarms-1-0:current-alarms:
                    $ref: '#/components/schemas/current-alarms'
                example:
                  alarms-1-0:current-alarms:
                    current-alarm-list:
                      - alarm-type-id: 'string'
                        alarm-type-qualifier: 'string'
                        resource: 'string'
                        alarm-severity: 'alarms-1-0:SEVERITY_TYPE_INDETERMINATE'
                        timestamp: '2010-11-20T14:00:00+01:00'
                    number-of-current-alarms: 0
                    time-of-latest-change: '2010-11-20T14:00:00+01:00'
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
            exec-time:
              $ref: '#/components/headers/exec-time'
            backend-time:
              $ref: '#/components/headers/backend-time'
            life-cycle-state:
              $ref: '#/components/headers/life-cycle-state'
        '4XX':
          $ref: '#/components/responses/responseForErroredServiceRequests'
